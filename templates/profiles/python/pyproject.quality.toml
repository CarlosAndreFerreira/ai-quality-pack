# Merge these sections into your pyproject.toml

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-cov", "hypothesis", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",
  "S",             # bandit (security)
  "ASYNC",         # async pitfalls
  "PT",            # pytest style
  "C90",           # complexity
  "N",             # naming
  "ANN",           # type annotations
]
ignore = ["ANN401"]  # allow Any where explicitly needed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
