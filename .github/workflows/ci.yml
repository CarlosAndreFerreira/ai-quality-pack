name: pack-ci
# Manual trigger only: the account has no Actions budget, so jobs started by a push did not run and showed as failed.
# Before a push, run the same three steps locally (see CONTRIBUTING notes in README: "Checks before a push").
# To run on each pull request again, add `pull_request:` under `on:`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/skill-evolve/scripts/validate_skills.py skills --strict
      - run: python skills/ste-writing/scripts/ste_lint.py README.md --lang en --threshold 60
