name: pack-ci
# Runs on each push to main and on each pull request, also from a fork. The job has read access only and uses no
# secret, so the code of a pull request cannot write to the repository or read a credential.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # a new push to the same branch or pull request stops the run that it replaces
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"  # the tests must pass with and without bytecode files (see README)
      - run: python skills/skill-evolve/scripts/validate_skills.py skills --strict
      - run: python skills/ste-writing/scripts/ste_lint.py README.md --lang en --threshold 60
